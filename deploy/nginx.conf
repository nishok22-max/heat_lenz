# nginx in front of the HeatLens API replicas (docker-compose.yml).

# Docker's DNS returns every replica of "api"; re-resolved every 10 s so scaling up is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

# A first rate limit at the edge, before a request reaches Python. The app applies its own
# per-session and per-IP limits too (backend/app/chat/engine.py).
limit_req_zone $binary_remote_addr zone=chat:10m rate=1r/s;
limit_req_status 429;

server {
    listen 80;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    set $api http://api:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The chat answer is a Server-Sent Events stream: pass each sentence on as it arrives.
    location = /api/v1/chat {
        limit_req zone=chat burst=5 nodelay;
        client_max_body_size 16k;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_pass $api;
    }

    location / {
        client_max_body_size 64k;
        proxy_read_timeout 60s;
        proxy_pass $api;
    }
}
