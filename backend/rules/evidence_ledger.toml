# The evidence ledger — IMPLEMENTATION_PLAN.md §7.5, served at /validation/evidence-ledger
# and rendered on the Methods page.
#
# One row per claim HeatLens could be asked to defend. `status` is one of:
#   MEASURED_POINT / MEASURED_CENSUS / MEASURED_FORECAST  observed or reanalysis/forecast input data
#   MODELLED_PUBLISHED      a published, peer-reviewed standard or coefficient
#   MODELLED_UNCALIBRATED   HeatLens's own construction, or a published model applied to new data;
#                           not validated against local health outcomes
#   NOT_AVAILABLE           does not exist in this build. Never shown as live.
#
# A row saying NOT_AVAILABLE is the point of this file, not an omission: the
# plan's rule is "nothing in a NOT_AVAILABLE row is ever shown as live".
#
# `component` is the row's stable identifier (tests key on it). `title` is the plain name the
# Methods page shows. `basis` and `note` are read by people: sources and what they mean, no file
# paths. Repository files go in `code`, which the page lists separately.

[[entries]]
component = "WBGT, UTCI, Heat Index, wet-bulb"
title = "Heat-stress measures (WBGT, UTCI, heat index, wet-bulb)"
status = "MODELLED_PUBLISHED"
basis = "Liljegren et al. 2008 / ISO 7243 (WBGT); UTCI (Blazejczyk 2012); NWS Rothfusz Heat Index; Stull 2011 (wet-bulb)"
note = "Published standards, unit-tested. Inputs are point weather from Open-Meteo, not station observations."
code = ["htsi/plan_a_standard_metrics.py"]

[[entries]]
component = "Historical weather inputs, 2010-2024"
title = "Past weather, 2010–2024"
status = "MEASURED_POINT"
basis = "Open-Meteo archive (reanalysis-based), one point at 23.03 N, 72.58 E"
note = "Reanalysis, not a station record, and one point represents the whole city. Against the Ahmedabad airport station (NOAA GSOD, WMO 42647), March–June 2010–2024, its daily maximum runs 1.65 °C cool on average (mean error 1.92 °C) and misses about half of the station's AMC alert days. Past AMC alert levels therefore use the station reading (see the alert-temperature row)."

[[entries]]
component = "Forecast weather inputs, D+1 to D+5"
title = "Weather forecast, 1–5 days ahead"
status = "MEASURED_FORECAST"
basis = "Open-Meteo forecast API"
note = "Used in this prototype in place of NCMRWF NCUM/NEPS, which need portal registration. Checked against the Ahmedabad airport station with Open-Meteo's archive of past forecasts, March–June 2024 onward: daily-maximum bias within ±0.25 °C and mean error 0.95–1.24 °C at 1–5 days ahead; the AMC alert level matches the station's on 83–86 % of days."

[[entries]]
component = "City max temperature for AMC alert levels"
title = "City maximum temperature behind the AMC alert"
status = "MEASURED_POINT"
basis = "Past dates: Ahmedabad airport station daily maximum, NOAA NCEI Global Summary of the Day, station 42647099999. Live dates: Open-Meteo forecast."
note = "A thermometer reading wherever one exists. GSOD derives some daily maxima from synoptic reports (flagged '*'), which can read slightly low. On a past date with no station reading, the reanalysis is used and the alert says so."
code = ["backend/scripts/build_station_verification.py"]

[[entries]]
component = "IMD heat-wave classification"
title = "IMD heat-wave days"
status = "MEASURED_POINT"
basis = "IMD 1-degree gridded Tmax/Tmin normals, 2010-2024"
note = "Used as a consistency check, not a health outcome."

[[entries]]
component = "Heat-mortality exposure-response (Ahmedabad)"
title = "Heat and deaths in Ahmedabad (published study)"
status = "MODELLED_PUBLISHED"
basis = "de Bont et al., Environ Int 2024;184:108461 (PMC11790314): +24.9 % (95 % CI 21.7-28.2) on 2-day heatwaves above the local p97"
note = "Peer-reviewed and specific to Ahmedabad. It supports the link between temperature and deaths, not HeatLens's own indices."

[[entries]]
component = "Mortality Risk Index (relative risk, MRI 0-100)"
title = "Mortality risk index (0–100)"
status = "MODELLED_UNCALIBRATED"
basis = "The de Bont et al. 2024 coefficients applied to a single-point Open-Meteo temperature series"
note = "How closely this series reproduces the study's heatwave statistics is tabulated on this page. The 0–100 scale is a design choice. No count of deaths is produced."

[[entries]]
component = "HTSI composite index"
title = "Composite heat-stress index (HTSI, research component)"
status = "MODELLED_UNCALIBRATED"
basis = "HeatLens's own composite of heat above local norms: daytime WBGT, hot nights, humidity, run length, UTCI and dry heat"
note = "Structural checks only: how it ranks May 2010, and its rank correlation with IMD Tmax. Never compared with health outcomes. Not the HeatLens score shown across the app."
code = ["htsi/plan_b_htsi.py"]

[[entries]]
component = "Heat debt / physiological strain (Plan C)"
title = "Body heat build-up (heat-debt model)"
status = "MODELLED_UNCALIBRATED"
basis = "ISO 7933 predicted heat strain (outdoor worker) and the Gagge–Ji two-node model for older people (Ji et al. 2022)"
note = "Physics-based but not calibrated. The app flags days when the model runs outside its validated range."
code = ["htsi/plan_c_heat_debt.py"]

[[entries]]
component = "Regime-aware ensemble score (0-100)"
title = "HeatLens heat-stress score (0–100)"
status = "MODELLED_CALIBRATED"
basis = "HeatLens's own score, combining UTCI, WBGT, unusual heat for the season and heat built up over hot nights; its meaning in deaths is fitted to the May 2010 Ahmedabad heatwave"
note = "Fitted to real daily deaths for one event, the 31 days of May 2010: deaths as a multiple of a normal May day, with a bootstrap interval, for scores 69–97 only (outside that range, no estimate). On those days it predicts deaths about as well as the airport thermometer: slightly worse on the same day, slightly better when the day before is counted. Not tested on any other year. Its weights, regimes and band cut-offs are still hand-set. A logistic regression on IMD heat-wave days runs at startup, but its result is never used by the score."
code = ["htsi/plan_d_ensemble.py", "backend/scripts/calibrate_score.py", "results/score_calibration.json"]

[[entries]]
component = "Daily deaths, Ahmedabad, May 2010"
title = "Daily deaths in Ahmedabad, May 2010"
status = "MEASURED_POINT"
basis = "Azhar GS et al., PLoS ONE 2014;9(3):e91831, Figures 1-2 (PLOS figshare)"
note = "The only public day-by-day Ahmedabad death counts found; the multi-year series is available on request only. Read from the published charts: the 2010 read-off sums to the published 4,462 deaths, the 2009/2011 reference is within 0.7 % of the published 3,118, and two independent charts agree to about 1 death a day."
code = ["backend/scripts/digitize_azhar2014.py", "datasets/health/ahmedabad_may2010_daily_deaths.csv"]

[[entries]]
component = "Heat Action Plan level thresholds"
title = "Official AMC alert levels"
status = "MODELLED_PUBLISHED"
basis = "AMC Heat Action Plan 2019 (Easy Read), section IV.A 'Color Signals for Heat Alert', p.3: White ≤ 41 °C, Yellow 41.1–43 °C, Orange 43.1–44.9 °C, Red ≥ 45 °C, on the day's maximum temperature"
note = "Ahmedabad's own published thresholds, used exactly as written: one level for the whole city each day. HeatLens heat stress and the mortality signal are shown beside the level and never change it."
code = ["backend/rules/hap_rules.toml"]

[[entries]]
component = "Elderly population share"
title = "Share of people aged 60+"
status = "MEASURED_CENSUS"
basis = "Census 2011 table C-13, Ahmadabad district, urban population: 480,980 aged 60+ of 6,063,047 (7.93 %)"
note = "The closest area to AMC that table C-13 covers (AMC's 5.58 million is about 92 % of the district's urban population). No ward-level age table exists, so every ward shows this same figure."

[[entries]]
component = "Ward population"
title = "People per ward"
status = "MODELLED_PUBLISHED"
basis = "JRC GHS-POP R2023A, 2020, 100 m grid, summed over each of the 48 ward boundaries: 7,334,231 in total, 15,155 to 657,559 per ward"
note = "A published model that spreads census counts over built-up land, not a headcount. Census 2011 counts the 57 wards of 2011 (AMC total 5,577,940); no boundary file maps those onto today's 48 wards, so that table is kept as a city-total cross-check only."
code = ["backend/scripts/build_ward_population.py", "datasets/census/"]

[[entries]]
component = "City population"
title = "City population, Census 2011"
status = "MEASURED_CENSUS"
basis = "Census of India 2011, Primary Census Abstract (town/village/ward), District Ahmadabad, DDW_PCA2407_2011_MDDS: Ahmadabad (M Corp.) 5,577,940"
note = "Read directly from the official file; its 57 ward rows sum exactly to this total."

[[entries]]
component = "City population, latest estimate"
title = "City population, latest estimate"
status = "MODELLED_PUBLISHED"
basis = "UN DESA Population Division, World Urbanization Prospects 2025, File 21: city of Ahmedabad, 7,667,167 in 2026 (7,632,408 in 2025)"
note = "An estimate, not a count: India has had no census since 2011 (Census 2027 counts people in February 2027; checked on censusindia.gov.in, 23 Sep 2026). The UN city covers the whole built-up area, including suburbs outside AMC, so it is larger than the Census AMC figure (UN 2011: 6.34 million; Census AMC: 5.58 million)."
code = ["backend/scripts/build_un_city_population.py", "backend/app/data/un_wup2025_ahmedabad.json"]

[[entries]]
component = "Administrative ward boundaries"
title = "Ward boundaries"
status = "MEASURED_GEODATA"
basis = "48 AMC ward boundaries from DataMeet (CC BY 4.0), retrieved 22 Sep 2026. Total area about 442 km², against a municipal area quoted at roughly 465–505 km²: consistent."
note = "Community-sourced, not an official AMC release. If AMC publishes an official boundary file, that one should be used instead."
code = ["datasets/geo/README.md"]

[[entries]]
component = "Zone-to-zone surface temperature differences"
title = "Ground temperature by ward (satellite)"
status = "MEASURED_SATELLITE"
basis = "MODIS land-surface temperature (MOD11A2.061 + MYD11A2.061, day and night, March–June 2022–2026, Microsoft Planetary Computer) for all 48 wards. 47 wards average the pixels centred inside them; one ward smaller than a pixel (1.9 km²) averages the pixels it overlaps."
note = "Shown as its own measured layer on the map. It is the temperature of the ground and roofs, not of the air, and it is NOT converted into ward air temperature, WBGT, UTCI or the HeatLens score."
code = ["backend/scripts/build_lst_offsets.py"]

[[entries]]
component = "Zone-to-zone air temperature and thermal-index differences"
title = "Air temperature and heat stress by ward"
status = "MEASURED_FORECAST"
basis = "Live and forecast dates: the Open-Meteo forecast at every ward's centre. The 48 wards fall in 8 weather-model grid cells; each cell runs through the full chain (air temperature, WBGT, UTCI, heat build-up, HeatLens score, mortality risk). Example, 23 Sep 2026: air maximum 34.6–35.7 °C and score 63–67 across cells."
note = "Weather-model resolution, not a station network: wards in the same grid cell share values, and each ward says which cell it uses and how many wards share it. Past dates (the 2010–2024 replay) use one city-level point for every ward. Real ward-level air temperature would need local stations."
code = ["backend/app/services/forecast.py"]

[[entries]]
component = "Absolute mortality or hospitalisation counts"
title = "Counts of deaths or hospital admissions"
status = "NOT_AVAILABLE"
basis = "Daily Ahmedabad outcome data is confidential (de Bont et al. data-availability statement)"
note = "Would need a calibration that does not exist. HeatLens gives relative risk only."

[[entries]]
component = "SMS / WhatsApp delivery"
title = "SMS / WhatsApp delivery"
status = "NOT_AVAILABLE"
basis = "No gateway configured"
note = "Messages are previews stamped SIMULATED. A real gateway needs a DLT-registered sender and approved templates."

[[entries]]
component = "CAP feed to SACHET; department webhooks"
title = "Alert feed to SACHET; department notifications"
status = "NOT_AVAILABLE"
basis = "CAP 1.2 alert and notification previews only"
note = "Status is always Draft. Nothing is sent anywhere."

[[entries]]
component = "Climate projections (e.g. 2035)"
title = "Climate projections"
status = "NOT_AVAILABLE"
basis = "Out of scope"
note = "Not built and not shown."

[[entries]]
component = "Intervention effects (cool roofs, greening, work hours)"
title = "What interventions achieve (cool roofs, parks, work hours)"
status = "MODELLED_PUBLISHED"
basis = "Cool roofs: MHT / IIPH Gandhinagar field study, 16 Ahmedabad slum homes, Oct 2017 (Vellingiri et al., Indian J Occup Environ Med 2020;24:25-29). Parks: Bowler et al. 2010 meta-analysis, Landscape and Urban Planning 97:147-155. Work hours: NDMA outdoor-worker advisory."
note = "Each finding is shown with what it actually measured (indoor air under one roof; a park against its surroundings). None measures an effect across a whole ward, so HeatLens does not project a changed ward score. Effects without a verifiable source are not shown."

[[entries]]
component = "Outdoor work time limits (minutes per hour)"
title = "Outdoor work limits in minutes per hour"
status = "NOT_AVAILABLE"
basis = "The ACGIH TLV / NIOSH work-rest tables could not be retrieved from a primary source (OSHA Technical Manual page unavailable; CDC PDF blocked to scripted access, 23 Sep 2026)"
note = "Not shown. Outdoor-work guidance follows the NDMA rule tied to the AMC alert level."

[[entries]]
component = "Ward land cover and 'why is it hot here' reasons"
title = "Land cover by ward, and why a ward runs hot"
status = "MEASURED_SATELLITE"
basis = "ESA WorldCover 10 m 2021 v200 (Zanaga et al. 2022, doi:10.5281/zenodo.7254221), per ward. City average: 55.5 % buildings and roads, 11.0 % trees, 22.8 % farmland."
note = "Across the 48 wards, more buildings go with warmer ground at night (r = 0.92), farmland with cooler nights (r = −0.97), and trees with cooler ground (r = −0.35 by day, −0.6 at night); buildings barely relate to daytime ground heat (r = 0.16). A land-cover reason is given only when |r| ≥ 0.3 and the ward's own measured ground temperature points the same way. A correlation across wards, not a controlled experiment."
code = ["backend/scripts/build_ward_landcover.py", "backend/app/services/explain.py"]
